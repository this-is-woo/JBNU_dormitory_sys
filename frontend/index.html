<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="전북대학교 생활관 선발 기준으로 환산점수를 계산하고 AI 모델로 생활관별 합격률을 예측합니다." />
    <meta name="theme-color" content="#1e1f22" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 화면 설정(내 정보 > 설정 > 테마 · 애니메이션 줄이기)을 화면을 그리기 전에 붙인다 (다크 모드에서 흰 화면이 번쩍이지 않게). lib/preferences.js 와 같은 저장 값 -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('jbnu-dorm:preferences')) || {}
        var r = document.documentElement
        if (p.theme === 'light' || p.theme === 'dark') r.dataset.theme = p.theme
        if (p.motion === 'reduce') r.dataset.motion = 'reduce'
      } catch (e) {}
    </script>
    <!-- 홈 화면에 추가(앱처럼 설치): 아이폰은 이렇게 설치해야 채팅 푸시 알림을 받을 수 있다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JBNU Dormi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 글꼴 CSS 는 화면 그리기를 막지 않게 받는다 (받는 동안은 기본 글꼴로 보이고, 받으면 바뀐다) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      />
    </noscript>
    <title>JBNU Dormi | 생활관 합격 예측</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
