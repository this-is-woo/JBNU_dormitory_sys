<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="전북대학교 생활관 선발 기준으로 환산점수를 계산하고 AI 모델로 생활관별 합격률을 예측합니다." />
    <meta name="theme-color" content="#1e1f22" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      링크 미리보기 카드 (카카오톡 · 에브리타임 · 인스타그램 등에 링크를 붙였을 때).
      그림 주소는 절대 주소여야 한다: 도메인을 바꾸면 og:image 도 바꾼다. 룸메이트 글 링크(/p/글id)는 api/share-post.js 가 따로 만든다
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JBNU Dormi" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="JBNU Dormi | 전북대 생활관 합격 예측 · 룸메이트 찾기" />
    <meta property="og:description" content="환산점수 계산, 호관별 예상 합격률, 생활 습관이 맞는 룸메이트 찾기까지 한 곳에서." />
    <meta property="og:image" content="https://jbnu-dormitory-sys.vercel.app/og/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JBNU Dormi — 전북대 생활관 합격 예측 · 룸메이트 찾기" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 화면 설정(내 정보 > 설정 > 테마 · 애니메이션 줄이기)을 화면을 그리기 전에 붙인다 (다크 모드에서 흰 화면이 번쩍이지 않게). lib/preferences.js 와 같은 저장 값 -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('jbnu-dorm:preferences')) || {}
        var r = document.documentElement
        if (p.theme === 'light' || p.theme === 'dark') r.dataset.theme = p.theme
        if (p.motion === 'reduce') r.dataset.motion = 'reduce'
      } catch (e) {}
    </script>
    <!-- 홈 화면에 추가(앱처럼 설치): 아이폰은 이렇게 설치해야 채팅 푸시 알림을 받을 수 있다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JBNU Dormi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 글꼴 CSS 는 화면 그리기를 막지 않게 받는다 (받는 동안은 기본 글꼴로 보이고, 받으면 바뀐다) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      />
    </noscript>
    <title>JBNU Dormi | 생활관 합격 예측</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      시작 안전망: 앱 코드가 화면을 그리지 못하면(시작 중 오류 · 코드 파일을 못 받음 · 10초 넘게 빈 화면)
      검정 · 흰 빈 화면 대신 이유와 [다시 불러오기] 버튼을 보여 준다. 화면이 한 번 그려지면 아무것도 하지 않는다.
    -->
    <script>
      ;(function () {
        var shown = false
        var drawn = function () {
          var root = document.getElementById('root')
          return Boolean(root && root.childElementCount)
        }
        var box = null
        function show(reason) {
          if (shown || drawn()) return
          shown = true
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          box = document.createElement('div')
          box.setAttribute('role', 'alert')
          box.style.cssText =
            'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;' +
            'font:15px/1.6 system-ui,-apple-system,sans-serif;' +
            (dark ? 'background:#1e1f22;color:#dfe1e5' : 'background:#fff;color:#1e1f22')
          var title = document.createElement('strong')
          title.style.fontSize = '18px'
          title.textContent = '화면을 불러오지 못했어요'
          var desc = document.createElement('p')
          desc.style.margin = '0'
          desc.textContent = '아래 버튼을 눌러 다시 불러와 주세요. 계속 이러면 아래 내용을 캡처해서 알려 주세요.'
          var detail = document.createElement('pre')
          detail.style.cssText = 'margin:0;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;font-size:12px;opacity:.75;background:' + (dark ? '#2b2d30' : '#f2f3f5')
          detail.textContent = String(reason).slice(0, 600) + '\n' + navigator.userAgent
          var retry = document.createElement('button')
          retry.type = 'button'
          retry.textContent = '다시 불러오기'
          retry.style.cssText = 'height:48px;border:0;border-radius:12px;font:inherit;font-weight:700;' + (dark ? 'background:#dfe1e5;color:#1e1f22' : 'background:#1e1f22;color:#fff')
          retry.onclick = function () {
            // 이 기기의 화면 설정 · 다시 불러오기 기록을 지우고 새로 받는다 (로그인은 그대로)
            try {
              localStorage.removeItem('jbnu-dorm:preferences')
              sessionStorage.removeItem('jbnu-dorm:reloaded-for-update')
            } catch (e) {}
            location.reload()
          }
          box.append(title, desc, detail, retry)
          document.body.appendChild(box)
          // 늦게라도 화면이 그려지면 안내를 걷는다
          new MutationObserver(function (_, observer) {
            if (!drawn()) return
            box.remove()
            observer.disconnect()
          }).observe(document.getElementById('root'), { childList: true })
        }
        // 잠깐 기다렸다가도 화면이 비어 있을 때만 (곧바로 다시 그려지는 오류는 넘어간다)
        function later(reason) {
          setTimeout(function () {
            show(reason)
          }, 1500)
        }
        window.addEventListener('error', function (e) {
          var el = e.target
          if (el && el !== window) {
            // 받지 못한 파일: 이 사이트의 코드 · 스타일만 (글꼴 CDN · 그림은 없어도 화면은 뜬다)
            var src = el.src || el.href || ''
            var ours = src.indexOf(location.origin + '/assets/') === 0
            if ((el.tagName === 'SCRIPT' || el.tagName === 'LINK') && ours) later('파일을 받지 못했어요: ' + src)
            return
          }
          later((e.message || '오류') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno : ''))
        }, true)
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          later('처리되지 않은 오류: ' + (r && (r.stack || r.message) ? r.stack || r.message : r))
        })
        setTimeout(function () {
          show('10초가 지나도 화면이 그려지지 않았어요')
        }, 10000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
