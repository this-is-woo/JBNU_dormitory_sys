# Render Blueprint — Dashboard → New → Blueprint 에서 이 저장소를 선택하면 자동으로 설정됩니다.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: jbnu-dorm-api
    runtime: python
    plan: free
    region: singapore # 한국과 가장 가까운 리전
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      # 아래 값은 Render 대시보드에서 직접 입력합니다. (sync: false → 저장소에 값을 두지 않음)
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
